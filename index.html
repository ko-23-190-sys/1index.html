<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<title>DM System</title>

<style>
body {
    font-family: Arial;
    background: #f4f7f6;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 500px;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.user {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.user:hover {
    background: #f0f0f0;
}

.chat {
    height: 300px;
    overflow-y: auto;
    margin: 10px 0;
    border: 1px solid #ddd;
    padding: 10px;
}

.msg {
    margin: 5px;
    padding: 8px 12px;
    border-radius: 10px;
    display: inline-block;
}

.me {
    background: #3d6ef5;
    color: white;
    float: right;
    clear: both;
}

.other {
    background: #eee;
    float: left;
    clear: both;
}
</style>
</head>

<body>

<div class="container">

<button id="loginBtn">Войти через Google</button>
<button id="logoutBtn">Выйти</button>

<h3 id="userName"></h3>

<h4>Выберите собеседника:</h4>
<div id="usersList"></div>

<h4 id="chatTitle"></h4>

<div id="chat" class="chat"></div>

<input id="messageInput" placeholder="Ваше сообщение...">
<button id="sendBtn">▶</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
getFirestore, collection, addDoc, query, orderBy,
onSnapshot, serverTimestamp, doc, setDoc, where
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import {
getAuth, signInWithPopup, GoogleAuthProvider,
signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// CONFIG
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// LOGIN
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

// CHAT STATE
let currentChatId = null;
let currentReceiver = null;

// CREATE CHAT ID
function getChatId(a, b) {
return [a, b].sort().join("_");
}

// AUTH STATE
onAuthStateChanged(auth, async (user) => {

if (!user) return;

userName.innerText = user.displayName;

// SAVE USER
await setDoc(doc(db, "users", user.uid), {
name: user.displayName,
email: user.email,
photo: user.photoURL
});

// LOAD USERS
onSnapshot(collection(db, "users"), (snap) => {

usersList.innerHTML = "";

snap.forEach(d => {

if (d.id === user.uid) return;

const u = d.data();

usersList.innerHTML += `
<div class="user" onclick="openChat('${d.id}', '${u.name}')">
${u.name}
</div>
`;
});
});
});

// OPEN CHAT
window.openChat = (uid, name) => {

currentReceiver = uid;
currentChatId = getChatId(auth.currentUser.uid, uid);

chatTitle.innerText = "Чат с: " + name;

// LISTEN MESSAGES
const q = query(
collection(db, "messages"),
where("chatId", "==", currentChatId),
orderBy("timestamp")
);

onSnapshot(q, (snap) => {

chat.innerHTML = "";

snap.forEach(doc => {

const m = doc.data();

chat.innerHTML += `
<div class="msg ${m.senderId === auth.currentUser.uid ? 'me' : 'other'}">
${m.text}
</div>
`;
});

chat.scrollTop = chat.scrollHeight;
});
};

// SEND MESSAGE
sendBtn.onclick = async () => {

const text = messageInput.value;
if (!text || !currentReceiver) return;

await addDoc(collection(db, "messages"), {
chatId: currentChatId,
senderId: auth.currentUser.uid,
text: text,
timestamp: serverTimestamp()
});

messageInput.value = "";
};

</script>
</body>
</html>
